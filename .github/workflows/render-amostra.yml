name: Renderizar amostra de derrame pleural

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testar projeto
        run: npm test
      - name: Preparar navegador do Remotion
        run: npx remotion browser ensure
      - name: Renderizar amostra
        run: npm run demo
      - name: Verificar formato e áudio
        run: |
          test -s output/amostra_derrame_premium.mp4
          node scripts/verify-render.mjs --sample output/amostra_derrame_premium.mp4 12.4
      - name: Disponibilizar amostra
        uses: actions/upload-artifact@v4
        with:
          name: amostra-derrame-pleural-full-hd
          path: output/amostra_derrame_premium.mp4
          if-no-files-found: error
          retention-days: 14
